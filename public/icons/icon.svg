<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Exo Genesis app icon: a world at dawn with the seed probe on its way in.
       Full-bleed, with everything that matters inside the central 80% so it also
       works as a maskable icon. PNGs: node tools/make-icons.mjs -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="58%" r="75%">
      <stop offset="0" stop-color="#0f2232"/>
      <stop offset="0.7" stop-color="#05080d"/>
    </radialGradient>
    <radialGradient id="world" cx="34%" cy="30%" r="80%">
      <stop offset="0" stop-color="#2d6f7c"/>
      <stop offset="0.45" stop-color="#123441"/>
      <stop offset="1" stop-color="#060d14"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff3ff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#5ff3ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="272" r="132"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#d6f6ff" opacity="0.7">
    <circle cx="118" cy="128" r="2"/><circle cx="392" cy="104" r="1.6"/><circle cx="420" cy="214" r="1.3"/>
    <circle cx="96" cy="300" r="1.4"/><circle cx="170" cy="86" r="1.1"/><circle cx="352" cy="412" r="1.2"/>
  </g>
  <!-- orbit, back half (behind the world) -->
  <ellipse cx="256" cy="272" rx="196" ry="58" transform="rotate(-18 256 272)" fill="none" stroke="#5ff3ff" stroke-opacity="0.28" stroke-width="5"/>
  <!-- the world -->
  <circle cx="256" cy="272" r="132" fill="url(#world)"/>
  <g clip-path="url(#disc)" fill="none" stroke="#7ff7c8" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round">
    <path d="M150 228 q40 -26 84 -6 t70 -10"/>
    <path d="M168 300 q46 18 92 0 t78 8"/>
    <path d="M206 352 q30 12 70 -2"/>
  </g>
  <circle cx="256" cy="272" r="130" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <!-- orbit, front half (over the world) -->
  <path d="M 69.6 332.4 A 196 58 -18 0 0 442.4 211.6" transform="rotate(0)" fill="none" stroke="#5ff3ff" stroke-width="6" stroke-linecap="round"/>
  <!-- the seed probe -->
  <circle cx="372" cy="146" r="18" fill="#5ff3ff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="372" cy="146" r="9" fill="#e9fdff"/>
</svg>
